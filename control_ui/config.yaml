udp:
  host: "192.168.1.35"
  recv_port: 14550
  send_port: 14551
  loop_filter: 0
  matlab_host: "127.0.0.1"
  matlab_port: 50010
  hand_host: "127.0.0.1"
  hand_port: 50020
  glove_port: 50030

local_checks:
  hand_udp_host: "127.0.0.1"
  hand_udp_port: 25001
  local_program_delay_sec: 5
  hand_ready_timeout_sec: 10
  glove_ready_timeout_sec: 15

hand_control:
  default_mode: "idle"
  start_glove_by_default: true

experiment:
  log_dir: "experiment_logs"

recording:
  root_dir: "recordings"
  alignment_hz: 20
  camera_service_host: "127.0.0.1"
  camera_service_port: 8092
  hand_telemetry_host: "127.0.0.1"
  hand_telemetry_port: 25003
  master_fusion_host: "127.0.0.1"
  master_fusion_port: 25007
  raw_master_host: "127.0.0.1"
  raw_master_port: 25009
  min_free_gib: 2.0
  max_duration_minutes: 10.0

canonical:
  # P0/E1 nominal semantic layer. This does not enable any E2 correction.
  control_path_enabled: true
  # Source adapters keep their native rates; canonical output is fixed-rate.
  publish_hz: 50.0
  # Logging is independent from control and may be disabled for parity checks.
  log_enabled: true
  stale_timeout_sec: 0.5
  # One physical six-DOF model drives PICO, glove, preset, measured and
  # corrected Canonical hand skeletons.
  wa100_kinematics_model_path: "wa100_kinematics_model.json"
  hand_host: "127.0.0.1"
  hand_port: 25001
  # Source-adaptive Canonical wrist planning. Use the runtime API override for
  # off/cross-planner E1 ablations without changing the frozen configuration.
  planner_enabled: true
  planner_keyboard_profile: "jerk_limited"
  planner_gamepad_profile: "jerk_limited"
  planner_pico_wrist_profile: "one_euro"
  planner_vr_controller_profile: "one_euro"
  planner_translation_max_velocity_m_s: 0.20
  planner_translation_max_acceleration_m_s2: 1.0
  planner_translation_max_jerk_m_s3: 10.0
  planner_roll_max_velocity_rad_s: 1.0
  planner_roll_max_acceleration_rad_s2: 5.0
  planner_roll_max_jerk_rad_s3: 50.0
  planner_one_euro_min_cutoff_hz: 2.0
  planner_one_euro_beta: 0.6
  planner_one_euro_derivative_cutoff_hz: 1.0
  planner_one_euro_max_velocity_m_s: 0.45
  planner_one_euro_max_roll_velocity_rad_s: 1.5
  planner_one_euro_innovation_base_m: 0.003
  planner_one_euro_prediction_horizon_sec: 0.06
  planner_one_euro_prediction_velocity_threshold_m_s: 0.03
  planner_one_euro_prediction_full_velocity_m_s: 0.10
  planner_one_euro_prediction_roll_threshold_rad_s: 0.10
  planner_one_euro_prediction_full_roll_rad_s: 0.50
  planner_hold_timeout_sec: 0.10

semantic_admittance:
  # Safe baseline: no canonical correction and existing low-level policy unchanged.
  mode: "OFF"
  measured_timeout_sec: 0.25
  current_timeout_sec: 0.25
  trigger_ma: 80.0
  registered_retreat_direction_C: [-1.0, 0.0, 0.0]
  wrist_max_displacement_m: 0.025
  wrist_max_speed_m_s: 0.02
  hand_max_unload_ratio: 0.25

arm_control:
  runtime_motion_duration_sec: 5.0
  legacy_home_fallback: false

websocket:
  host: "0.0.0.0"
  port: 8080
  path: "/udp"
  status_path: "/status"
  raw_input_path: "/raw-input"
  canonical_path: "/canonical-goal"

api:
  host: "0.0.0.0"
  port: 8090

rtsp_dual_camera:
  enabled: true
  # display: browser shows both cameras; stream: publish RTSP/HLS on startup.
  startup_mode: "display"
  capture_backend: "latest_frame"
  python_exe: "E:/PICO/Control-Program-For-5-DOF/Hand_Tracker/.conda/hand-tracker-arm/python.exe"
  left_video_device: "RGB Camera"
  left_camera_index: 1
  left_mirror: false
  left_vertical_flip: false
  left_input_codec: "mjpeg"
  left_video_pin_name: ""
  right_video_device: "USB Camera"
  # Match the same physical camera across driver/firmware naming variants.
  # Rules are tried left-to-right: exact match first, then case-insensitive substring match.
  right_video_device_match: "USB Camera|DSJ-2062-309"
  right_camera_index: 0
  right_mirror: true
  right_vertical_flip: false
  right_input_codec: "mjpeg"
  right_video_pin_name: ""
  input_fourcc: "MJPG"
  stream_crf: 26
  # PICO reaches the PC-side RTSP server through `adb reverse tcp:8554 tcp:8554`.
  stream_host: "127.0.0.1"
  rtsp_port: 8554
  hls_port: 8081
  hls_enabled: false
  # Reuse the existing path so Unity/LibVLC can keep the same URL.
  stream_path: "usb_camera"
  video_size: "640x480"
  # Capture at the supported 30 fps mode and publish only the latest frames at 20 fps.
  capture_framerate: 30
  framerate: 20
  layout: "vstack"

jetson:
  host: "192.168.1.35"
  user: "night"
  start_script: "/home/night/robot/start_arm.sh"
  stop_script: "/home/night/robot/stop_arm.sh"
  check_script: "/home/night/robot/check_arm.sh"

programs:
  # Canonical WA100 runtime generated from the current workspace source.
  # Keep this aligned with WA100_RUNTIME_DIR in wa100-sdk-publish/CMakeLists.txt.
  hand_exe: "wa100-sdk-publish\\build\\bin\\udp_receiver_unity.exe"
  hand_args: "right"
  unity_glove: "right1\\My project.exe"
  unity_glove_args: "-screen-fullscreen 0 -screen-width 640 -screen-height 360"
  matlab_exe: "C:\\Program Files\\MATLAB\\R2022b\\bin\\matlab.exe"
  matlab_start_script: "D:\\robot_demo\\start_master_hand.m"
