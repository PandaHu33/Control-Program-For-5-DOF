udp:
  host: "192.168.1.35"
  recv_port: 14550
  send_port: 14551
  loop_filter: 0
  matlab_host: "127.0.0.1"
  matlab_port: 50010
  hand_host: "127.0.0.1"
  hand_port: 50020
  glove_port: 50030

local_checks:
  hand_udp_host: "127.0.0.1"
  hand_udp_port: 25001
  local_program_delay_sec: 5
  hand_ready_timeout_sec: 10
  glove_ready_timeout_sec: 15

hand_control:
  default_mode: "glove"
  start_glove_by_default: true

experiment:
  log_dir: "experiment_logs"

recording:
  root_dir: "recordings"
  alignment_hz: 20
  camera_service_host: "127.0.0.1"
  camera_service_port: 8092
  hand_telemetry_host: "127.0.0.1"
  hand_telemetry_port: 25003
  master_fusion_host: "127.0.0.1"
  master_fusion_port: 25007
  min_free_gib: 2.0
  max_duration_minutes: 10.0

arm_control:
  runtime_motion_duration_sec: 5.0
  legacy_home_fallback: false

websocket:
  host: "0.0.0.0"
  port: 8080
  path: "/udp"
  status_path: "/status"

api:
  host: "0.0.0.0"
  port: 8090

rtsp_dual_camera:
  enabled: true
  # display: browser shows both cameras; stream: publish RTSP/HLS on startup.
  startup_mode: "display"
  capture_backend: "latest_frame"
  left_video_device: "RGB Camera"
  left_camera_index: 1
  left_mirror: true
  left_input_codec: "mjpeg"
  left_video_pin_name: ""
  right_video_device: "USB Camera"
  right_camera_index: 0
  right_mirror: true
  right_input_codec: "mjpeg"
  right_video_pin_name: ""
  input_fourcc: "MJPG"
  stream_crf: 26
  stream_host: "192.168.3.10"
  rtsp_port: 8554
  hls_port: 8081
  # Reuse the existing path so Unity/LibVLC can keep the same URL.
  stream_path: "usb_camera"
  video_size: "640x480"
  framerate: 20
  layout: "vstack"

jetson:
  host: "192.168.1.35"
  user: "night"
  start_script: "/home/night/robot/start_arm.sh"
  stop_script: "/home/night/robot/stop_arm.sh"
  check_script: "/home/night/robot/check_arm.sh"

programs:
  # Canonical WA100 runtime generated from the current workspace source.
  # Keep this aligned with WA100_RUNTIME_DIR in wa100-sdk-publish/CMakeLists.txt.
  hand_exe: "wa100-sdk-publish\\build\\bin\\udp_receiver_unity.exe"
  hand_args: "right"
  unity_glove: "right1\\My project.exe"
  unity_glove_args: "-screen-fullscreen 0 -screen-width 640 -screen-height 360"
  matlab_exe: "C:\\Program Files\\MATLAB\\R2022b\\bin\\matlab.exe"
  matlab_start_script: "D:\\robot_demo\\start_master_hand.m"
