input:
  source: "vr"

service:
  host: "0.0.0.0"
  port: 8091
  event_hz: 30
  mjpeg_hz: 15
  jpeg_quality: 80

teleop:
  phase: "approach"

camera:
  index: "auto"
  min_detection_confidence: 0.7
  min_tracking_confidence: 0.7
  show_timing: true

control:
  # Hold this gesture to toggle lock/unlock. Options: victory, open_palm, fist, pinch.
  unlock_gesture: "victory"
  unlock_hold_sec: 0.35
  # Ignore lock/unlock changes for this long after a state change.
  state_toggle_cooldown_sec: 5.0
  # Keep motion active briefly if victory is missed for one or two frames.
  control_clutch_grace_sec: 0.35
  pinch_threshold: 0.45

  # Hand offset deadzones. Image x/y are normalized coordinates; depth is estimated in meters.
  deadzone_xy: 0.06
  deadzone_depth: 0.04
  smoothing_alpha: 0.18

  # Converts hand offset into soft-limited dimensionless XYZ input axes.
  axis_gain_x: 1.5
  axis_gain_y: 1.8
  axis_gain_z: 1.8
  max_axis: 0.45

  # UI position-control step per 100 ms tick. Kept smaller than keyboard/gamepad initially.
  position_step_m: 0.02

  # After unlock, victory is the motion clutch. Pinch closes the gripper in the UI; open_palm opens it.
  # Tracker axes: axis.x from hand depth, axis.y from image x, axis.z from image y.
  # The control UI remaps them to arm axes: image y -> arm X, image x -> arm Y, depth -> arm Z.
  # Flip signs here if the observed direction is opposite to the desired direction.
  axis_sign:
    x_from_depth: 1
    y_from_image_x: -1
    z_from_image_y: 1

vr:
  # TCP server receiving Unity wrist pose through: adb reverse tcp:5005 tcp:5005
  host: "127.0.0.1"
  port: 5005
  hand: "right"
  pose_source: "xr_hand_wrist"
  # Default H5 mapping mode for VR wrist input: position or velocity.
  mapping_mode: "velocity"
  # Right wrist tracking workspace in Unity/VR coordinates.
  # x: left/right, y: height, z: forward/back.
  wrist_workspace:
    x_min: -0.5
    x_max: 0.9
    y_min: 0.8
    y_max: 1.6
    z_min: -0.2
    z_max: 0.6
  stale_timeout_sec: 0.40
  # Unity evaluates the left-hand fist and sends it as the port 5005 deadman bit.
  # Fist=1, open/not tracked/stale=0.
  deadman_label: "Unity left fist"
  # Relative twist around the Unity pose forward axis drives J4.
  joint4_axis: "z"
  joint4_gain: 0.5
  joint4_sign: -1.0

xr_gesture_state:
  # Local left-fist state published by unity_hand_udp_bridge.py.
  host: "127.0.0.1"
  port: 25002
  stale_timeout_sec: 0.40

controller_delta:
  # Shared by VR hand tracking Delta mode and right-controller Delta mode.
  gain_xyz: [0.5, 0.5, 0.5]
  stale_timeout_sec: 0.40
  deadman_button_label: "Left X"
